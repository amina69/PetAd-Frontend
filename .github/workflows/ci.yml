name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js 20.x
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --maxsockets 1 --retry 3

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: Verify dependency lockfiles are unchanged
        run: git diff --exit-code -- package-lock.json pnpm-lock.yaml

      - name: Lint check
        run: npm run lint

      - name: Build check
        run: npm run build

      - name: Run unit tests
        run: npm test

  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js 20.x
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --maxsockets 1 --retry 3

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
