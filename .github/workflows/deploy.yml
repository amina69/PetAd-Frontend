name: Deploy

on:
  push:
    branches: [staging]
    tags: ['v*']

permissions:
  contents: read

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20.x
      - name: Install Vercel CLI
        run: npm install --global vercel
      - name: Build and deploy staging
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_WEBSOCKET_URL: ${{ vars.VITE_WEBSOCKET_URL }}
          VITE_ENABLE_ANALYTICS: ${{ vars.VITE_ENABLE_ANALYTICS }}
        run: |
          vercel pull --yes --environment=preview --git-branch=staging --token="$VERCEL_TOKEN"
          vercel build --token="$VERCEL_TOKEN" \
            --build-env "VITE_API_URL=$VITE_API_URL" \
            --build-env "VITE_WEBSOCKET_URL=$VITE_WEBSOCKET_URL" \
            --build-env "VITE_ENABLE_ANALYTICS=$VITE_ENABLE_ANALYTICS"
          vercel deploy --prebuilt --token="$VERCEL_TOKEN"

  deploy-production:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20.x
      - name: Install Vercel CLI
        run: npm install --global vercel
      - name: Build and deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_WEBSOCKET_URL: ${{ vars.VITE_WEBSOCKET_URL }}
          VITE_ENABLE_ANALYTICS: ${{ vars.VITE_ENABLE_ANALYTICS }}
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN" \
            --build-env "VITE_API_URL=$VITE_API_URL" \
            --build-env "VITE_WEBSOCKET_URL=$VITE_WEBSOCKET_URL" \
            --build-env "VITE_ENABLE_ANALYTICS=$VITE_ENABLE_ANALYTICS"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
