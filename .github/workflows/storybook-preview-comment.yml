name: Post Storybook Preview Link

on:
  workflow_run:
    workflows: ["Storybook Preview"]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Post preview artifact link
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const pullRequest = run.pull_requests?.[0];
            if (!pullRequest) {
              core.info('No pull request is associated with this workflow run.');
              return;
            }

            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
            });
            if (!artifacts.data.artifacts.some((artifact) => artifact.name === 'storybook-preview')) {
              core.setFailed('The Storybook preview artifact was not uploaded.');
              return;
            }

            const link = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${run.id}#artifacts`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullRequest.number,
              body: `### Storybook preview\n\nThe static Storybook preview artifact is available [from this workflow run](${link}).`,
            });
